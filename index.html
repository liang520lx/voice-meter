<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1720">
<title>声音仪表</title>
<style>
  :root { --bg:#1b1720; --card:#262130; --fg:#f3eef6; --dim:#a79fb2; --pink:#ff8fb8; --blue:#8fc9ff;
          --green:#5fd39a; --yellow:#ffd166; --red:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
         padding:12px 14px calc(16px + env(safe-area-inset-bottom)); max-width:560px; margin-inline:auto; }
  h1 { font-size:18px; margin:4px 0 10px; font-weight:600; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; padding:10px 0; border:0; border-radius:10px; background:var(--card); color:var(--dim); font-size:15px; }
  .tabs button.on { background:var(--pink); color:#2a1020; font-weight:600; }
  .tip { color:var(--dim); font-size:14px; margin:0 0 10px; min-height:42px; }
  .status { border-radius:14px; padding:14px; text-align:center; font-size:20px; font-weight:600; background:var(--card); margin-bottom:10px; transition:background .2s; }
  .status.green { background:var(--green); color:#0e2a1c; } .status.yellow { background:var(--yellow); color:#33270a; }
  .status.red { background:var(--red); color:#300; }
  .nums { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .num { background:var(--card); border-radius:12px; padding:10px 12px; }
  .num .k { color:var(--dim); font-size:13px; } .num .v { font-size:30px; font-weight:700; line-height:1.2; }
  .num .d { font-size:14px; color:var(--dim); }
  canvas { width:100%; height:150px; background:var(--card); border-radius:12px; display:block; margin-bottom:8px; }
  .row { display:flex; gap:8px; margin:10px 0; }
  .row button { flex:1; padding:14px 0; border:0; border-radius:12px; font-size:16px; font-weight:600; }
  #go { background:var(--pink); color:#2a1020; } #base { background:var(--blue); color:#0b2138; }
  button:disabled { opacity:.45; }
  .small { color:var(--dim); font-size:13px; }
  .legend span { margin-right:12px; }
</style>
</head>
<body>
<h1>声音仪表 <span class="small">v2 · 10-26</span></h1>

<div class="tabs" id="tabs">
  <button data-m="1" class="on">阶段1 共鸣</button>
  <button data-m="2">阶段2 音高</button>
  <button data-m="0">自由看</button>
</div>
<p class="tip" id="tip"></p>

<div class="status" id="status">点「开始」，允许用麦克风</div>

<div class="nums">
  <div class="num"><div class="k">音高</div><div class="v" id="pv">—</div><div class="d" id="pd">&nbsp;</div></div>
  <div class="num"><div class="k">共鸣（F2）</div><div class="v" id="fv">—</div><div class="d" id="fd">&nbsp;</div></div>
</div>

<canvas id="cp"></canvas>
<canvas id="cf"></canvas>
<div class="small legend"><span style="color:var(--pink)">━ 音高</span><span style="color:var(--blue)">━ 共鸣</span><span>虚线 = 本音基准，色带 = 目标</span></div>

<div class="row">
  <button id="go">开始</button>
  <button id="base" disabled>录本音基准（3 秒）</button>
</div>
<p class="small" id="info">基准：还没录。录法：用平时说话的声音拖长"啊——"，或者读一句话。<br>
  共鸣数字要拿<b>同一个元音、同一句话</b>前后比，换了字不能比。</p>
<p class="small" id="score"></p>

<script src="dsp.js?v=2"></script>
<script>
const $ = id => document.getElementById(id);
const TIPS = {
  1: "喉咙停在「小狗喘气」的位置，用平时的音高说话。目标：共鸣比本音高 8% 以上，音高别跟着往上跑（±2 个半音以内）。拖长同一个元音最准，说句子时数字会随字跳，看大方向。",
  2: "保持小狗位置，往上滑到 165–190 Hz。目标：音高进色带，共鸣不低于本音。",
  0: "只看数字，不打分。",
};
let mode = 1, base = JSON.parse(localStorage.getItem("voiceBase") || "null");
let ctx, an, buf, running = false, recBase = null, greenSec = 0, lastT = 0;
const P = [], F = [];           // 最近一段的音高 / F2（{t,v}）
const SPAN = 8;                 // 图上显示几秒

function med(a) { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; }
const st = (a, b) => 12 * Math.log2(a / b);

function setMode(m) {
  mode = m; $("tip").textContent = TIPS[m];
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", +b.dataset.m === m));
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setMode(+b.dataset.m));
setMode(1); showBase();

function showBase() {
  $("info").innerHTML = base
    ? `基准：音高 <b>${base.p.toFixed(0)} Hz</b>，共鸣 <b>${base.f.toFixed(0)} Hz</b>（${base.date}）。换了练习内容就重录一次。`
    : $("info").innerHTML;
}

$("go").onclick = async () => {
  if (running) { running = false; ctx.close(); $("go").textContent = "开始"; $("base").disabled = true; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    ctx = new AudioContext(); an = ctx.createAnalyser(); an.fftSize = 2048;
    ctx.createMediaStreamSource(s).connect(an); buf = new Float32Array(an.fftSize);
    running = true; $("go").textContent = "停止"; $("base").disabled = false;
    try { await navigator.wakeLock?.request("screen"); } catch (e) {}
    lastT = performance.now(); loop();
  } catch (e) {
    $("status").textContent = "打不开麦克风：" + e.message; $("status").className = "status red";
  }
};

$("base").onclick = () => {
  recBase = { p: [], f: [], until: performance.now() + 3000 };
  $("base").disabled = true; $("base").textContent = "录着呢，用本音说…";
};

let floor = 1;
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  const now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
  an.getFloatTimeDomainData(buf);
  let e = 0; for (const v of buf) e += v * v; const rms = Math.sqrt(e / buf.length);
  floor = Math.min(rms, floor * 1.002 + 1e-6);          // 慢慢跟随底噪
  const t = now / 1000;
  if (rms > Math.max(0.004, floor * 3)) {
    const p = VoiceDSP.pitch(buf, ctx.sampleRate);
    if (p) {
      P.push({ t, v: p });
      const f = VoiceDSP.formants(buf, ctx.sampleRate);
      if (f) F.push({ t, v: f[1] });
      if (recBase) { recBase.p.push(p); if (f) recBase.f.push(f[1]); }
    }
  }
  while (P.length && P[0].t < t - SPAN) P.shift();
  while (F.length && F[0].t < t - SPAN) F.shift();

  if (recBase && now > recBase.until) {
    if (recBase.p.length > 30 && recBase.f.length > 20) {
      base = { p: med(recBase.p), f: med(recBase.f), date: new Date().toLocaleDateString("zh-CN") };
      localStorage.setItem("voiceBase", JSON.stringify(base)); showBase();
    } else { $("info").textContent = "基准没录上：声音太少，靠近手机、说满 3 秒再试。"; }
    recBase = null; $("base").disabled = false; $("base").textContent = "重录本音基准（3 秒）";
  }

  // 最近 0.6 秒的值才算"现在"
  const pNow = med(P.filter(o => o.t > t - 0.6).map(o => o.v));
  const fNow = med(F.filter(o => o.t > t - 1.5).map(o => o.v));
  const live = P.filter(o => o.t > t - 0.6).length >= 8;
  $("pv").textContent = live ? pNow.toFixed(0) + " Hz" : "—";
  $("fv").textContent = live && fNow ? fNow.toFixed(0) + " Hz" : "—";
  const dp = base && live ? st(pNow, base.p) : null, df = base && live && fNow ? (fNow / base.f - 1) * 100 : null;
  $("pd").textContent = dp == null ? " " : `比本音 ${dp >= 0 ? "+" : ""}${dp.toFixed(1)} 个半音`;
  $("fd").textContent = df == null ? " " : `比本音 ${df >= 0 ? "+" : ""}${df.toFixed(0)}%`;

  judge(live, pNow, dp, df, dt);
  draw($("cp"), P, t, 80, 400, true, mode === 2 ? [165, 190] : base && mode === 1 ? [base.p * 2 ** (-2 / 12), base.p * 2 ** (2 / 12)] : null, base?.p, "#ff8fb8");
  draw($("cf"), F, t, 900, 2800, false, base && mode ? [base.f * (mode === 1 ? 1.08 : 1), 2800] : null, base?.f, "#8fc9ff");
}

// 自测用：地址后面加 #selftest 会自动开始并录基准（配合浏览器的假麦克风）
if (location.hash === "#selftest") { $("go").click(); setTimeout(() => $("base").click(), 800); }

function judge(live, p, dp, df, dt) {
  const s = $("status");
  let c = "", txt;
  if (!live) txt = recBase ? "录基准中…用本音说" : "在听…出声就行";
  else if (mode === 0) txt = "自由看";
  else if (mode === 1) {
    if (!base) txt = "先录本音基准";
    else if (dp > 2.5) { c = "red"; txt = "音高跟着跑了，降回平时的高度"; }
    else if (df == null) txt = "再拖长一点，看不清共鸣";
    else if (df >= 8) { c = "green"; txt = "小狗位置 ✓ 保持住"; }
    else { c = "yellow"; txt = "共鸣还没动，喉咙再往上提一点"; }
  } else {
    if (base && df != null && df < 0) { c = "red"; txt = "共鸣掉了，喉咙沉下去了"; }
    else if (p < 165) { c = "yellow"; txt = "再高一点点"; }
    else if (p > 200) { c = "yellow"; txt = "高过头了，往下放"; }
    else { c = "green"; txt = "音高 ✓ 保持住"; }
  }
  s.className = "status " + c; s.textContent = txt;
  if (c === "green") greenSec += dt;
  $("score").textContent = greenSec ? `这次绿灯累计 ${greenSec.toFixed(0)} 秒` : "";
}

function draw(cv, data, t, lo, hi, logY, band, ref, color) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth * dpr, h = cv.clientHeight * dpr;
  if (cv.width !== w) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d"); g.clearRect(0, 0, w, h);
  const y = v => { const r = logY ? Math.log(v / lo) / Math.log(hi / lo) : (v - lo) / (hi - lo); return h - Math.min(1, Math.max(0, r)) * h; };
  const x = tt => (1 - (t - tt) / SPAN) * w;
  if (band) { g.fillStyle = "rgba(95,211,154,.18)"; g.fillRect(0, y(band[1]), w, y(band[0]) - y(band[1])); }
  g.fillStyle = "#a79fb2"; g.font = `${11 * dpr}px sans-serif`;
  for (const v of logY ? [100, 150, 200, 300] : [1200, 1600, 2000, 2400]) { g.fillText(v, 4 * dpr, y(v) - 2 * dpr); g.fillRect(0, y(v), w, 0.5 * dpr); }
  if (ref) { g.strokeStyle = "#f3eef6"; g.setLineDash([6 * dpr, 6 * dpr]); g.lineWidth = dpr; g.beginPath(); g.moveTo(0, y(ref)); g.lineTo(w, y(ref)); g.stroke(); g.setLineDash([]); }
  g.strokeStyle = color; g.lineWidth = 3 * dpr; g.beginPath();
  for (let i = 0; i < data.length; i++) {
    const o = data[i], gap = i && o.t - data[i - 1].t > 0.15;
    if (!i || gap) g.moveTo(x(o.t), y(o.v)); else g.lineTo(x(o.t), y(o.v));
  }
  g.stroke();
}
</script>
</body>
</html>
